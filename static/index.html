<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KidJukebox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        /* Progress bar styling */
        input[type="range"] {
            -webkit-appearance: none;
            background: transparent;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            height: 8px;
            background: #374151;
            border-radius: 4px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ec4899;
            margin-top: -4px;
        }
        input[type="range"]::-moz-range-track {
            height: 8px;
            background: #374151;
            border-radius: 4px;
        }
        input[type="range"]::-moz-range-thumb {
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ec4899;
            border: none;
        }

        /* Animation for currently playing */
        @keyframes pulse-border {
            0%, 100% { border-color: #ec4899; }
            50% { border-color: #f472b6; }
        }
        .playing-card {
            animation: pulse-border 2s ease-in-out infinite;
        }

        /* ---- Fullscreen lyrics (karaoke) ---- */
        #lyricsBackdrop {
            filter: blur(40px) brightness(0.35);
            transform: scale(1.15); /* hide the soft edges the blur creates */
        }

        #lyricsLines {
            /* Enough padding that the first and last lines can still centre */
            padding-top: 45vh;
            padding-bottom: 45vh;
            scroll-behavior: smooth;
        }

        .lyric-line {
            transition: opacity 300ms ease, transform 300ms ease,
                        color 300ms ease, text-shadow 300ms ease;
            opacity: 0.25;
            font-size: 1.25rem;
            line-height: 2.25rem;
            color: #d1d5db;
            transform: scale(1);
            transform-origin: left center;
        }
        .lyric-near {
            opacity: 0.5;
            font-size: 1.5rem;
        }
        .lyric-active {
            opacity: 1;
            color: #ffffff;
            font-weight: 700;
            font-size: 2rem;
            line-height: 2.75rem;
            transform: scale(1.04);
            text-shadow: 0 0 24px rgba(236, 72, 153, 0.9);
        }
        /* Blank lines in the source act as breathing room, not clickable text */
        .lyric-line:empty::after {
            content: "\00a0";
        }

        @keyframes lyric-beat {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50%      { transform: scale(1.25); opacity: 1; }
        }
        .lyric-waiting span {
            display: inline-block;
            animation: lyric-beat 1.4s ease-in-out infinite;
        }
        .lyric-waiting span:nth-child(2) { animation-delay: 0.2s; }
        .lyric-waiting span:nth-child(3) { animation-delay: 0.4s; }

        @media (prefers-reduced-motion: reduce) {
            #lyricsLines { scroll-behavior: auto; }
            .lyric-line { transition: none; }
            .lyric-waiting span { animation: none; }
        }

        /* Loading spinner */
        .spinner {
            border: 3px solid #374151;
            border-top: 3px solid #ec4899;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-gray-800 shadow-lg p-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <span class="text-3xl">🎵</span>
            <h1 class="text-2xl font-bold text-pink-400">KidJukebox</h1>
        </div>
        <div class="flex items-center gap-2">
            <button id="btnPlaylist" onclick="showPlaylist()" class="px-4 py-2 rounded-lg bg-pink-600 hover:bg-pink-700 transition font-medium">
                Playlist
            </button>
            <button id="btnSearch" onclick="showSearch()" class="px-4 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 transition font-medium">
                Search
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-auto p-4 pb-40">
        <!-- Storage Info -->
        <div id="storageInfo" class="mb-4 text-sm text-gray-400 flex items-center gap-4">
            <span id="songCount">0 songs</span>
            <span id="storageSize">0 MB</span>
        </div>

        <!-- Playlist View -->
        <div id="playlistView">
            <div id="playlistEmpty" class="text-center py-12 text-gray-400">
                <p class="text-6xl mb-4">🎶</p>
                <p class="text-xl mb-2">Your playlist is empty!</p>
                <p>Search for songs and add them to your playlist.</p>
            </div>
            <div id="playlistItems" class="space-y-3"></div>
        </div>

        <!-- Search View -->
        <div id="searchView" class="hidden">
            <div class="mb-4">
                <form onsubmit="performSearch(event)" class="flex gap-2">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search for a song..."
                        class="flex-1 px-4 py-3 rounded-lg bg-gray-800 border border-gray-700 focus:border-pink-500 focus:outline-none text-lg"
                    >
                    <button type="submit" class="px-6 py-3 bg-pink-600 hover:bg-pink-700 rounded-lg transition font-medium">
                        🔍
                    </button>
                </form>
            </div>
            <div id="searchLoading" class="hidden text-center py-8">
                <div class="spinner mx-auto mb-4"></div>
                <p class="text-gray-400">Searching...</p>
            </div>
            <div id="searchResults" class="space-y-3"></div>
            <div id="searchEmpty" class="hidden text-center py-12 text-gray-400">
                <p class="text-xl">No results found</p>
            </div>
        </div>
    </main>

    <!-- Now Playing Bar -->
    <div id="nowPlayingBar" class="fixed bottom-0 left-0 right-0 bg-gray-800 border-t border-gray-700 p-4 shadow-lg">
        <div class="max-w-4xl mx-auto">
            <div class="flex items-center gap-4">
                <!-- Thumbnail -->
                <img id="npThumbnail" src="" alt="" class="w-16 h-16 rounded-lg object-cover bg-gray-700">

                <!-- Song Info & Progress -->
                <div class="flex-1 min-w-0">
                    <p id="npTitle" class="font-medium truncate text-lg">No song playing</p>
                    <div class="flex items-center gap-2 mt-1">
                        <span id="npCurrentTime" class="text-sm text-gray-400 w-12">0:00</span>
                        <input
                            type="range"
                            id="progressBar"
                            min="0"
                            max="100"
                            value="0"
                            class="flex-1"
                            oninput="seekTo(this.value)"
                        >
                        <span id="npDuration" class="text-sm text-gray-400 w-12">0:00</span>
                    </div>
                </div>

                <!-- Controls -->
                <div class="flex items-center gap-2">
                    <button onclick="playPrevious()" class="p-3 rounded-full hover:bg-gray-700 transition text-2xl">⏮️</button>
                    <button id="btnPlayPause" onclick="togglePlayPause()" class="p-4 rounded-full bg-pink-600 hover:bg-pink-700 transition text-2xl">▶️</button>
                    <button onclick="playNext()" class="p-3 rounded-full hover:bg-gray-700 transition text-2xl">⏭️</button>
                    <button id="btnShuffle" onclick="toggleShuffle()" class="p-3 rounded-full hover:bg-gray-700 transition text-xl">🔀</button>
                    <button id="btnLyrics" onclick="openLyrics()" title="Sing along"
                            class="p-3 rounded-full hover:bg-gray-700 transition text-2xl">🎤</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div id="previewModal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4">
        <div class="bg-gray-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
            <img id="previewThumbnail" src="" alt="" class="w-full aspect-video rounded-lg object-cover mb-4 bg-gray-700">
            <h3 id="previewTitle" class="text-xl font-bold mb-2 line-clamp-2"></h3>
            <p id="previewChannel" class="text-gray-400 mb-1"></p>
            <p id="previewDuration" class="text-pink-400 mb-6"></p>

            <div id="previewActions" class="flex gap-3">
                <button onclick="closePreview()" class="flex-1 px-4 py-3 bg-gray-700 hover:bg-gray-600 rounded-lg transition font-medium">
                    Cancel
                </button>
                <button onclick="downloadPreviewSong()" class="flex-1 px-4 py-3 bg-pink-600 hover:bg-pink-700 rounded-lg transition font-medium">
                    Add to Playlist
                </button>
            </div>

            <div id="previewDownloading" class="hidden text-center py-4">
                <div class="spinner mx-auto mb-4"></div>
                <p id="downloadProgress" class="text-gray-400">Downloading...</p>
            </div>
        </div>
    </div>

    <!-- Fullscreen Lyrics (karaoke) -->
    <!-- A fixed overlay, not the Fullscreen API: the launcher's iframe does not
         grant the fullscreen permission, so requestFullscreen() would be blocked. -->
    <div id="lyricsOverlay" class="hidden fixed inset-0 z-40 bg-gray-900 overflow-hidden">
        <!-- Blurred album art backdrop -->
        <img id="lyricsBackdrop" src="" alt="" class="absolute inset-0 w-full h-full object-cover">
        <div class="absolute inset-0 bg-gray-900 bg-opacity-60"></div>

        <div class="relative h-full flex flex-col">
            <!-- Header -->
            <div class="flex items-center gap-4 p-4 shrink-0">
                <span class="text-3xl">🎤</span>
                <p id="lyricsTitle" class="flex-1 min-w-0 truncate text-xl font-bold text-pink-400"></p>
                <button onclick="closeLyrics()" aria-label="Close lyrics"
                        class="p-3 rounded-full bg-gray-800 bg-opacity-80 hover:bg-gray-700 transition text-2xl leading-none">
                    ✕
                </button>
            </div>

            <!-- Shown when the source has no timestamps, so nothing highlights -->
            <p id="lyricsPlainNote" class="hidden shrink-0 px-6 pb-2 text-sm text-gray-400 text-center">
                Words only - can't follow along
            </p>

            <!-- Lines -->
            <div id="lyricsScroll" class="flex-1 overflow-y-auto px-6 md:px-16">
                <div id="lyricsLines" class="max-w-3xl mx-auto"></div>
            </div>

            <!-- States -->
            <div id="lyricsLoading" class="hidden absolute inset-0 flex flex-col items-center justify-center">
                <div class="spinner mb-4"></div>
                <p class="text-gray-300">Finding the words...</p>
            </div>
            <div id="lyricsMessage" class="hidden absolute inset-0 flex flex-col items-center justify-center text-center px-8">
                <p id="lyricsMessageEmoji" class="text-7xl mb-4">🎶</p>
                <p id="lyricsMessageText" class="text-2xl text-gray-300"></p>
            </div>

            <!-- Timing Adjustment Toolbar -->
            <div id="lyricsTimingToolbar" class="hidden shrink-0 px-4 py-2 flex items-center justify-center gap-2 bg-gray-900 bg-opacity-80 border-t border-gray-700 text-sm">
                <span class="text-gray-400 mr-1">⏱</span>
                <span id="timingOffsetDisplay" class="text-gray-300 font-mono w-16 text-center">+0.0s</span>
                <span class="text-gray-500 mx-1">|</span>
                <button onclick="adjustTiming(-0.5)" class="px-2 py-1 rounded bg-gray-700 hover:bg-gray-600 text-gray-300 transition text-xs font-medium" title="Shift lyrics 0.5s earlier">−0.5s</button>
                <button onclick="adjustTiming(-0.1)" class="px-2 py-1 rounded bg-gray-700 hover:bg-gray-600 text-gray-300 transition text-xs font-medium" title="Shift lyrics 0.1s earlier">−0.1s</button>
                <button onclick="resetTiming()" class="px-2 py-1 rounded bg-gray-700 hover:bg-gray-600 text-gray-400 transition text-xs font-medium" title="Reset timing to zero">Reset</button>
                <button onclick="adjustTiming(0.1)" class="px-2 py-1 rounded bg-gray-700 hover:bg-gray-600 text-gray-300 transition text-xs font-medium" title="Shift lyrics 0.1s later">+0.1s</button>
                <button onclick="adjustTiming(0.5)" class="px-2 py-1 rounded bg-gray-700 hover:bg-gray-600 text-gray-300 transition text-xs font-medium" title="Shift lyrics 0.5s later">+0.5s</button>
            </div>

            <!-- Transport (the now playing bar is covered by this overlay) -->
            <div class="shrink-0 p-4 flex items-center justify-center gap-4 bg-gray-900 bg-opacity-70">
                <button onclick="playPrevious()" class="p-3 rounded-full hover:bg-gray-700 transition text-2xl">⏮️</button>
                <button id="btnLyricsPlayPause" onclick="togglePlayPause()"
                        class="p-4 rounded-full bg-pink-600 hover:bg-pink-700 transition text-2xl">▶️</button>
                <button onclick="playNext()" class="p-3 rounded-full hover:bg-gray-700 transition text-2xl">⏭️</button>
            </div>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="audioPlayer"></audio>

    <script>
        // =======================================================================
        // Application State
        // =======================================================================
        let state = {
            view: 'playlist',
            searchQuery: '',
            searchResults: [],
            playlist: [],
            currentSongIndex: -1,
            isPlaying: false,
            currentTime: 0,
            duration: 0,
            isDownloading: false,
            previewSong: null,
            shuffle: false,
            shuffleOrder: [],
            lyrics: null,          // { status, synced, lines: [{time, text}] }
            lyricsVideoId: null,   // which song state.lyrics belongs to
            lyricsIndex: -1,       // index of the currently highlighted line
            lyricsOpen: false,
            lyricsRaf: null,
            timingOffset: 0,       // per-song adjustment in seconds
            storageInfo: {
                songCount: 0,
                totalMB: 0
            }
        };

        const audio = document.getElementById('audioPlayer');

        // =======================================================================
        // Initialization
        // =======================================================================
        async function init() {
            await loadPlaylist();
            await loadStorageInfo();
            setupAudioEvents();
            renderPlaylist();
        }

        function setupAudioEvents() {
            audio.addEventListener('timeupdate', () => {
                state.currentTime = audio.currentTime;
                state.duration = audio.duration || 0;
                updateProgress();
            });

            audio.addEventListener('ended', () => {
                playNext();
            });

            audio.addEventListener('play', () => {
                state.isPlaying = true;
                updatePlayButton();
                if (state.lyricsOpen) startLyricsSync();
            });

            audio.addEventListener('pause', () => {
                state.isPlaying = false;
                updatePlayButton();
                stopLyricsSync();
            });

            // A seek while paused should still move the highlight
            audio.addEventListener('seeked', () => {
                if (state.lyricsOpen && state.lyrics && state.lyrics.synced) {
                    const adjustedTime = audio.currentTime - state.timingOffset;
                    const index = findLyricIndex(adjustedTime);
                    if (index !== state.lyricsIndex) {
                        state.lyricsIndex = index;
                        highlightLyricLine(index);
                    }
                }
            });

            audio.addEventListener('loadedmetadata', () => {
                state.duration = audio.duration;
                updateProgress();
            });
        }

        // =======================================================================
        // API Calls
        // =======================================================================
        async function loadPlaylist() {
            try {
                const response = await fetch('/api/playlist');
                const data = await response.json();
                state.playlist = data.items || [];
            } catch (error) {
                console.error('Failed to load playlist:', error);
                state.playlist = [];
            }
        }

        async function loadStorageInfo() {
            try {
                const response = await fetch('/api/storage');
                const data = await response.json();
                state.storageInfo = {
                    songCount: data.song_count,
                    totalMB: data.total_mb
                };
                updateStorageDisplay();
            } catch (error) {
                console.error('Failed to load storage info:', error);
            }
        }

        async function searchYouTube(query) {
            const response = await fetch('/api/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, limit: 10 })
            });
            return await response.json();
        }

        async function downloadSong(videoId, title, thumbnailUrl, duration) {
            console.log('[Download] Starting download for:', { videoId, title, duration });
            console.log('[Download] Thumbnail URL:', thumbnailUrl);

            const response = await fetch('/api/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    video_id: videoId,
                    title: title,
                    thumbnail_url: thumbnailUrl,
                    duration: duration
                })
            });

            console.log('[Download] Response status:', response.status, response.statusText);

            const data = await response.json();
            console.log('[Download] Response data:', data);

            return data;
        }

        async function removeFromPlaylist(itemId) {
            const response = await fetch(`/api/playlist/${itemId}`, {
                method: 'DELETE'
            });
            return await response.json();
        }

        // =======================================================================
        // View Management
        // =======================================================================
        function showPlaylist() {
            state.view = 'playlist';
            document.getElementById('playlistView').classList.remove('hidden');
            document.getElementById('searchView').classList.add('hidden');
            document.getElementById('btnPlaylist').classList.add('bg-pink-600');
            document.getElementById('btnPlaylist').classList.remove('bg-gray-700');
            document.getElementById('btnSearch').classList.remove('bg-pink-600');
            document.getElementById('btnSearch').classList.add('bg-gray-700');
        }

        function showSearch() {
            state.view = 'search';
            document.getElementById('playlistView').classList.add('hidden');
            document.getElementById('searchView').classList.remove('hidden');
            document.getElementById('btnSearch').classList.add('bg-pink-600');
            document.getElementById('btnSearch').classList.remove('bg-gray-700');
            document.getElementById('btnPlaylist').classList.remove('bg-pink-600');
            document.getElementById('btnPlaylist').classList.add('bg-gray-700');
            document.getElementById('searchInput').focus();
        }

        // =======================================================================
        // Search
        // =======================================================================
        async function performSearch(event) {
            event.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            state.searchQuery = query;
            document.getElementById('searchLoading').classList.remove('hidden');
            document.getElementById('searchResults').innerHTML = '';
            document.getElementById('searchEmpty').classList.add('hidden');

            try {
                const data = await searchYouTube(query);
                state.searchResults = data.results || [];
                renderSearchResults();
            } catch (error) {
                console.error('Search failed:', error);
                state.searchResults = [];
            }

            document.getElementById('searchLoading').classList.add('hidden');
        }

        function renderSearchResults() {
            const container = document.getElementById('searchResults');
            const emptyEl = document.getElementById('searchEmpty');

            if (state.searchResults.length === 0) {
                container.innerHTML = '';
                emptyEl.classList.remove('hidden');
                return;
            }

            emptyEl.classList.add('hidden');
            container.innerHTML = state.searchResults.map((result, idx) => `
                <div class="search-result flex items-center gap-4 bg-gray-800 rounded-xl p-3 hover:bg-gray-750 cursor-pointer transition"
                     data-index="${idx}">
                    <img src="${escapeHtml(result.thumbnail_url)}" alt="" class="w-24 h-16 rounded-lg object-cover bg-gray-700">
                    <div class="flex-1 min-w-0">
                        <p class="font-medium truncate">${escapeHtml(result.title)}</p>
                        <p class="text-sm text-gray-400">${escapeHtml(result.duration)} • ${escapeHtml(result.channel)}</p>
                    </div>
                    <button class="p-2 text-2xl hover:scale-110 transition">➕</button>
                </div>
            `).join('');

            // Add click handlers using event delegation
            container.querySelectorAll('.search-result').forEach(el => {
                el.addEventListener('click', () => {
                    const result = state.searchResults[el.dataset.index];
                    showPreview(result.video_id, result.title, result.thumbnail_url, result.duration, result.channel);
                });
            });
        }

        // =======================================================================
        // Preview Modal
        // =======================================================================
        function showPreview(videoId, title, thumbnailUrl, duration, channel) {
            // Check if already in playlist
            const existing = state.playlist.find(item => item.video_id === videoId);
            if (existing) {
                alert('This song is already in your playlist!');
                return;
            }

            state.previewSong = { videoId, title, thumbnailUrl, duration, channel };

            document.getElementById('previewThumbnail').src = thumbnailUrl;
            document.getElementById('previewTitle').textContent = title;
            document.getElementById('previewChannel').textContent = channel;
            document.getElementById('previewDuration').textContent = duration;
            document.getElementById('previewActions').classList.remove('hidden');
            document.getElementById('previewDownloading').classList.add('hidden');
            document.getElementById('previewModal').classList.remove('hidden');
        }

        function closePreview() {
            state.previewSong = null;
            document.getElementById('previewModal').classList.add('hidden');
        }

        async function downloadPreviewSong() {
            console.log('[Download] downloadPreviewSong called');

            if (!state.previewSong || state.isDownloading) {
                console.log('[Download] Skipping - previewSong:', !!state.previewSong, 'isDownloading:', state.isDownloading);
                return;
            }

            state.isDownloading = true;
            document.getElementById('previewActions').classList.add('hidden');
            document.getElementById('previewDownloading').classList.remove('hidden');
            document.getElementById('downloadProgress').textContent = 'Downloading...';

            try {
                const { videoId, title, thumbnailUrl, duration } = state.previewSong;
                console.log('[Download] Calling downloadSong with:', { videoId, title, duration });

                const result = await downloadSong(videoId, title, thumbnailUrl, duration);

                if (result.success) {
                    console.log('[Download] Success! Reloading playlist...');
                    await loadPlaylist();
                    await loadStorageInfo();
                    renderPlaylist();
                    closePreview();
                    showPlaylist();
                } else {
                    console.warn('[Download] Backend returned failure:', result.message);
                    document.getElementById('downloadProgress').textContent = result.message || 'Download failed';
                    document.getElementById('previewActions').classList.remove('hidden');
                    document.getElementById('previewDownloading').classList.add('hidden');
                }
            } catch (error) {
                console.error('[Download] Exception during download:', error);
                console.error('[Download] Error name:', error.name);
                console.error('[Download] Error message:', error.message);
                document.getElementById('downloadProgress').textContent = 'Download failed';
                document.getElementById('previewActions').classList.remove('hidden');
                document.getElementById('previewDownloading').classList.add('hidden');
            }

            state.isDownloading = false;
        }

        // =======================================================================
        // Playlist Rendering
        // =======================================================================
        function renderPlaylist() {
            const container = document.getElementById('playlistItems');
            const emptyEl = document.getElementById('playlistEmpty');

            if (state.playlist.length === 0) {
                container.innerHTML = '';
                emptyEl.classList.remove('hidden');
                return;
            }

            emptyEl.classList.add('hidden');
            container.innerHTML = state.playlist.map((item, index) => {
                const isPlaying = index === state.currentSongIndex;
                const noLyrics = item.lyrics_status === 'none';
                return `
                    <div class="flex items-center gap-4 bg-gray-800 rounded-xl p-3 ${isPlaying ? 'border-2 border-pink-500 playing-card' : ''} transition"
                         onclick="playSong(${index})">
                        <img src="/api/thumbnail/${item.thumbnail_file}" alt=""
                             class="w-20 h-14 rounded-lg object-cover bg-gray-700"
                             onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23374151%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2255%22 text-anchor=%22middle%22 fill=%22%239ca3af%22 font-size=%2230%22>🎵</text></svg>'">
                        <div class="flex-1 min-w-0">
                            <p class="font-medium truncate ${isPlaying ? 'text-pink-400' : ''}">${escapeHtml(item.title)}</p>
                            <p class="text-sm text-gray-400">${escapeHtml(item.duration)}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            ${isPlaying ? '<span class="text-pink-400 text-xl">🎵</span>' : ''}
                            <button onclick="event.stopPropagation(); openLyricsFor(${index})"
                                    ${noLyrics ? 'disabled' : ''}
                                    title="${noLyrics ? 'No words found for this song' : 'Sing along'}"
                                    class="p-2 transition ${noLyrics
                                        ? 'opacity-30 cursor-not-allowed'
                                        : 'text-gray-400 hover:text-pink-400'}">
                                🎤
                            </button>
                            <button onclick="event.stopPropagation(); deleteSong('${item.id}')"
                                    class="p-2 text-gray-400 hover:text-red-400 transition">
                                🗑️
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function deleteSong(itemId) {
            if (!confirm('Remove this song from your playlist?')) return;

            // Check if it's the currently playing song
            const itemIndex = state.playlist.findIndex(item => item.id === itemId);
            const wasPlaying = itemIndex === state.currentSongIndex;

            try {
                await removeFromPlaylist(itemId);
                await loadPlaylist();
                await loadStorageInfo();

                // Adjust current song index if needed
                if (wasPlaying) {
                    audio.pause();
                    state.currentSongIndex = -1;
                    state.isPlaying = false;
                    if (state.lyricsOpen) closeLyrics();
                    state.lyrics = null;
                    state.lyricsVideoId = null;
                    updateNowPlaying();
                } else if (itemIndex < state.currentSongIndex) {
                    state.currentSongIndex--;
                }

                renderPlaylist();
            } catch (error) {
                console.error('Failed to delete song:', error);
            }
        }

        // =======================================================================
        // Playback Controls
        // =======================================================================
        function playSong(index) {
            if (index < 0 || index >= state.playlist.length) return;

            state.currentSongIndex = index;
            const song = state.playlist[index];

            audio.src = `/api/audio/${song.audio_file}`;
            audio.play();

            // Drop the previous song's lyrics; reload if the view is open
            if (state.lyricsVideoId !== song.video_id) {
                stopLyricsSync();
                state.lyrics = null;
                state.lyricsVideoId = null;
                state.lyricsIndex = -1;
            }

            updateNowPlaying();
            renderPlaylist();

            if (state.lyricsOpen) {
                openLyrics();
            }
        }

        function togglePlayPause() {
            if (state.currentSongIndex === -1 && state.playlist.length > 0) {
                playSong(0);
                return;
            }

            if (state.isPlaying) {
                audio.pause();
            } else {
                audio.play();
            }
        }

        function playNext() {
            if (state.playlist.length === 0) return;

            let nextIndex;
            if (state.shuffle && state.shuffleOrder.length > 0) {
                const currentPos = state.shuffleOrder.indexOf(state.currentSongIndex);
                const nextPos = (currentPos + 1) % state.shuffleOrder.length;
                nextIndex = state.shuffleOrder[nextPos];
            } else {
                nextIndex = (state.currentSongIndex + 1) % state.playlist.length;
            }

            playSong(nextIndex);
        }

        function playPrevious() {
            if (state.playlist.length === 0) return;

            // If more than 3 seconds into song, restart it
            if (audio.currentTime > 3) {
                audio.currentTime = 0;
                return;
            }

            let prevIndex;
            if (state.shuffle && state.shuffleOrder.length > 0) {
                const currentPos = state.shuffleOrder.indexOf(state.currentSongIndex);
                const prevPos = (currentPos - 1 + state.shuffleOrder.length) % state.shuffleOrder.length;
                prevIndex = state.shuffleOrder[prevPos];
            } else {
                prevIndex = (state.currentSongIndex - 1 + state.playlist.length) % state.playlist.length;
            }

            playSong(prevIndex);
        }

        function toggleShuffle() {
            state.shuffle = !state.shuffle;
            const btn = document.getElementById('btnShuffle');

            if (state.shuffle) {
                btn.classList.add('bg-pink-600');
                generateShuffleOrder();
            } else {
                btn.classList.remove('bg-pink-600');
                state.shuffleOrder = [];
            }
        }

        function generateShuffleOrder() {
            state.shuffleOrder = Array.from({ length: state.playlist.length }, (_, i) => i);
            // Fisher-Yates shuffle
            for (let i = state.shuffleOrder.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [state.shuffleOrder[i], state.shuffleOrder[j]] = [state.shuffleOrder[j], state.shuffleOrder[i]];
            }
            // Move current song to front if playing
            if (state.currentSongIndex !== -1) {
                const currentPos = state.shuffleOrder.indexOf(state.currentSongIndex);
                if (currentPos > 0) {
                    state.shuffleOrder.splice(currentPos, 1);
                    state.shuffleOrder.unshift(state.currentSongIndex);
                }
            }
        }

        function seekTo(value) {
            if (state.duration > 0) {
                audio.currentTime = (value / 100) * state.duration;
            }
        }

        // =======================================================================
        // UI Updates
        // =======================================================================
        function updateNowPlaying() {
            const song = state.playlist[state.currentSongIndex];

            if (song) {
                document.getElementById('npThumbnail').src = `/api/thumbnail/${song.thumbnail_file}`;
                document.getElementById('npTitle').textContent = song.title;
            } else {
                document.getElementById('npThumbnail').src = '';
                document.getElementById('npTitle').textContent = 'No song playing';
            }

            updateLyricsButton();
        }

        function updateProgress() {
            const progress = state.duration > 0 ? (state.currentTime / state.duration) * 100 : 0;
            document.getElementById('progressBar').value = progress;
            document.getElementById('npCurrentTime').textContent = formatTime(state.currentTime);
            document.getElementById('npDuration').textContent = formatTime(state.duration);
        }

        function updatePlayButton() {
            const icon = state.isPlaying ? '⏸️' : '▶️';
            document.getElementById('btnPlayPause').textContent = icon;
            document.getElementById('btnLyricsPlayPause').textContent = icon;
        }

        function updateStorageDisplay() {
            document.getElementById('songCount').textContent = `${state.storageInfo.songCount} songs`;
            document.getElementById('storageSize').textContent = `${state.storageInfo.totalMB} MB`;
        }

        // =======================================================================
        // Lyrics (fullscreen karaoke)
        // =======================================================================
        async function fetchLyrics(videoId) {
            const response = await fetch(`/api/lyrics/${videoId}`);
            if (!response.ok) throw new Error(`Lyrics request failed: ${response.status}`);
            return await response.json();
        }

        function openLyricsFor(index) {
            if (index !== state.currentSongIndex) {
                playSong(index);
            }
            openLyrics();
        }

        async function openLyrics() {
            const song = state.playlist[state.currentSongIndex];
            if (!song) return;

            state.lyricsOpen = true;
            document.getElementById('lyricsOverlay').classList.remove('hidden');
            document.getElementById('lyricsTitle').textContent = song.title;
            document.getElementById('lyricsBackdrop').src = `/api/thumbnail/${song.thumbnail_file}`;
            updatePlayButton();

            // Already have this song's lyrics in memory
            if (state.lyrics && state.lyricsVideoId === song.video_id) {
                renderLyrics();
                updateTimingDisplay();
                startLyricsSync();
                return;
            }

            showLyricsState('loading');
            try {
                const data = await fetchLyrics(song.video_id);
                // The user may have skipped to another song while we were waiting
                const current = state.playlist[state.currentSongIndex];
                if (!current || current.video_id !== data.video_id) return;

                state.lyrics = data;
                state.lyricsVideoId = data.video_id;
                state.lyricsIndex = -1;
                state.timingOffset = data.timing_offset || 0;

                // Reflect a freshly discovered miss in the playlist buttons
                const entry = state.playlist.find(i => i.video_id === data.video_id);
                if (entry && entry.lyrics_status !== data.status) {
                    entry.lyrics_status = data.status;
                    renderPlaylist();
                }

                renderLyrics();
                updateTimingDisplay();
                startLyricsSync();
            } catch (error) {
                console.error('Failed to load lyrics:', error);
                showLyricsState('message', '😕', 'Could not load the words right now.');
            }
        }

        function closeLyrics() {
            state.lyricsOpen = false;
            stopLyricsSync();
            document.getElementById('lyricsOverlay').classList.add('hidden');
        }

        function toggleLyrics() {
            if (state.lyricsOpen) {
                closeLyrics();
            } else {
                openLyrics();
            }
        }

        function showLyricsState(which, emoji, text) {
            const loading = document.getElementById('lyricsLoading');
            const message = document.getElementById('lyricsMessage');
            const scroll = document.getElementById('lyricsScroll');

            loading.classList.toggle('hidden', which !== 'loading');
            message.classList.toggle('hidden', which !== 'message');
            scroll.classList.toggle('hidden', which !== 'lines');

            // The note only ever belongs with a rendered set of lines
            if (which !== 'lines') {
                document.getElementById('lyricsPlainNote').classList.add('hidden');
            }

            if (which === 'message') {
                document.getElementById('lyricsMessageEmoji').textContent = emoji;
                document.getElementById('lyricsMessageText').textContent = text;
            }
        }

        function renderLyrics() {
            const data = state.lyrics;
            const container = document.getElementById('lyricsLines');
            container.innerHTML = '';

            if (!data || data.status === 'none' || !data.lines.length) {
                showLyricsState('message', '🎵', 'No words for this song yet!');
                document.getElementById('lyricsTimingToolbar').classList.add('hidden');
                return;
            }

            if (data.status === 'instrumental') {
                showLyricsState('message', '🎶', 'This song has no words - just music!');
                document.getElementById('lyricsTimingToolbar').classList.add('hidden');
                return;
            }

            // textContent, never innerHTML: this text comes from an external service
            data.lines.forEach((line, i) => {
                const el = document.createElement('p');
                el.className = 'lyric-line';
                el.dataset.index = i;
                el.textContent = line.text;
                // Unsynced lyrics can still be tapped through; synced ones seek
                if (data.synced && line.time !== null) {
                    el.style.cursor = 'pointer';
                    // Clicking a line seeks to the corrected position:
                    // lyrics time + offset = what currentTime should be
                    el.onclick = () => { audio.currentTime = line.time + state.timingOffset; };
                }
                container.appendChild(el);
            });

            showLyricsState('lines');

            // Show timing toolbar for synced lyrics (offset adjustments make sense)
            document.getElementById('lyricsTimingToolbar').classList.toggle('hidden', !data.synced);

            // No timestamps: show the words evenly, and say why nothing moves
            document.getElementById('lyricsPlainNote').classList.toggle('hidden', data.synced);
            if (!data.synced) {
                container.querySelectorAll('.lyric-line').forEach(el => {
                    el.classList.add('lyric-near');
                });
            }

            state.lyricsIndex = -1;
            document.getElementById('lyricsScroll').scrollTop = 0;
        }

        function findLyricIndex(time) {
            const lines = state.lyrics.lines;

            // Fast path: still on the current line, or advanced by one
            const i = state.lyricsIndex;
            if (i >= 0 && lines[i].time <= time &&
                (i === lines.length - 1 || lines[i + 1].time > time)) {
                return i;
            }
            if (i + 1 < lines.length && lines[i + 1].time <= time &&
                (i + 2 >= lines.length || lines[i + 2].time > time)) {
                return i + 1;
            }

            // Seek or first run: binary search for the last line at or before `time`
            let low = 0, high = lines.length - 1, found = -1;
            while (low <= high) {
                const mid = (low + high) >> 1;
                if (lines[mid].time <= time) {
                    found = mid;
                    low = mid + 1;
                } else {
                    high = mid - 1;
                }
            }
            return found;
        }

        function syncLyricsFrame() {
            if (!state.lyricsOpen || !state.lyrics || !state.lyrics.synced) return;

            // Apply the user's timing offset when searching for the current line.
            // Negative offset  →  adjustedTime is later  →  highlight moves earlier.
            // Positive offset  →  adjustedTime is earlier  →  highlight moves later.
            const adjustedTime = audio.currentTime - state.timingOffset;
            const index = findLyricIndex(adjustedTime);
            if (index !== state.lyricsIndex) {
                state.lyricsIndex = index;
                highlightLyricLine(index);
            }

            state.lyricsRaf = requestAnimationFrame(syncLyricsFrame);
        }

        function highlightLyricLine(index) {
            const container = document.getElementById('lyricsLines');
            const lines = container.querySelectorAll('.lyric-line');

            lines.forEach((el, i) => {
                const distance = Math.abs(i - index);
                el.classList.toggle('lyric-active', i === index);
                el.classList.toggle('lyric-near', distance === 1);
            });

            // Before the first timestamp there is nothing to centre on
            if (index < 0) return;

            const active = lines[index];
            if (!active) return;

            const scroll = document.getElementById('lyricsScroll');
            scroll.scrollTo({
                top: active.offsetTop - (scroll.clientHeight / 2) + (active.offsetHeight / 2),
                behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches
                    ? 'auto' : 'smooth'
            });
        }

        function startLyricsSync() {
            stopLyricsSync();
            if (!state.lyrics || !state.lyrics.synced) return;
            state.lyricsRaf = requestAnimationFrame(syncLyricsFrame);
        }

        function stopLyricsSync() {
            if (state.lyricsRaf !== null) {
                cancelAnimationFrame(state.lyricsRaf);
                state.lyricsRaf = null;
            }
        }

        // =======================================================================
        // Timing Adjustment  —  manually nudge lyrics into sync
        // =======================================================================

        async function saveTimingOffset(videoId, offset) {
            try {
                await fetch(`/api/lyrics/${videoId}/offset`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ offset })
                });
            } catch (error) {
                console.error('Failed to save timing offset:', error);
            }
        }

        function adjustTiming(delta) {
            const newOffset = Math.round((state.timingOffset + delta) * 100) / 100;
            // Clamp to a reasonable range (-30s to +30s)
            if (newOffset < -30 || newOffset > 30) return;
            state.timingOffset = newOffset;
            updateTimingDisplay();
            saveTimingOffset(state.lyricsVideoId, newOffset);
        }

        function resetTiming() {
            state.timingOffset = 0;
            updateTimingDisplay();
            saveTimingOffset(state.lyricsVideoId, 0);
        }

        function updateTimingDisplay() {
            const el = document.getElementById('timingOffsetDisplay');
            if (!el) return;
            const sign = state.timingOffset >= 0 ? '+' : '';
            el.textContent = `${sign}${state.timingOffset.toFixed(1)}s`;
        }

        function updateLyricsButton() {
            const song = state.playlist[state.currentSongIndex];
            const btn = document.getElementById('btnLyrics');
            const unavailable = !song || song.lyrics_status === 'none';

            btn.disabled = unavailable;
            btn.classList.toggle('opacity-30', unavailable);
            btn.classList.toggle('cursor-not-allowed', unavailable);
            btn.title = unavailable ? 'No words found for this song' : 'Sing along';
        }

        // =======================================================================
        // Utilities
        // =======================================================================
        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML.replace(/'/g, '&#39;').replace(/"/g, '&quot;');
        }

        // =======================================================================
        // Keyboard Shortcuts
        // =======================================================================
        document.addEventListener('keydown', (e) => {
            // Don't capture when typing in search
            if (document.activeElement.tagName === 'INPUT') return;

            switch(e.code) {
                case 'Escape':
                    if (state.lyricsOpen) {
                        e.preventDefault();
                        closeLyrics();
                    }
                    break;
                case 'KeyL':
                    e.preventDefault();
                    toggleLyrics();
                    break;
                case 'Space':
                    e.preventDefault();
                    togglePlayPause();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    audio.currentTime = Math.min(audio.currentTime + 10, audio.duration);
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    audio.currentTime = Math.max(audio.currentTime - 10, 0);
                    break;
                case 'KeyN':
                    e.preventDefault();
                    playNext();
                    break;
                case 'KeyP':
                    e.preventDefault();
                    playPrevious();
                    break;
                case 'KeyS':
                    e.preventDefault();
                    toggleShuffle();
                    break;
            }
        });

        // Initialize on load
        init();
    </script>
</body>
</html>
